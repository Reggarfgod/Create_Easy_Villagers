name: Publish to CurseForge

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build mod JAR
        run: ./gradlew build --no-daemon

      - name: Read Project ID from gradle.properties
        id: cf_config
        run: |
          CF_ID=$(grep -E "^curseforge_project_id=" gradle.properties | cut -d'=' -f2 | tr -d ' \r\n' || true)
          if [ -z "$CF_ID" ]; then
            CF_ID="create-easy-villagers"
          fi
          echo "project_id=$CF_ID" >> $GITHUB_OUTPUT

      - name: Publish to CurseForge
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          curseforge-id: ${{ steps.cf_config.outputs.project_id }}
          game-versions: 1.21.1
          loaders: neoforge
          files: build/libs/!(*-sources|*-javadoc|*-dev).jar
          changelog: ${{ github.event.release.body || 'Initial release' }}
