name: Bug report
description: File a bug report for Create Easy Villagers
labels: [bug, triage]
assignees:
  - Reggarfgod
body:
  - type: markdown
    attributes:
      value: |
        > [!WARNING]
        > This form is **only for bug reports**!
        > Please don't use this for feature requests or questions.
        > Issues lacking reproduction steps or logs may be closed without response.
  - type: textarea
    id: description
    attributes:
      label: Bug description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: dropdown
    id: mc_version
    attributes:
      label: Minecraft version
      description: Select the Minecraft version you are running.
      options:
        - "1.21.1"
        - "1.20.1"
        - Other (specify in description)
    validations:
      required: true
  - type: dropdown
    id: mod_loader
    attributes:
      label: Mod loader
      description: Select which mod loader you are using.
      options:
        - NeoForge
        - Forge
    validations:
      required: true
  - type: input
    id: mod_loader_version
    attributes:
      label: Mod loader version
      description: Exact version of Forge or NeoForge.
      placeholder: e.g. NeoForge 21.1.65 / Forge 47.3.0
    validations:
      required: true
  - type: input
    id: mod_version
    attributes:
      label: Create Easy Villagers version
      description: The version of Create Easy Villagers installed.
      placeholder: e.g. 1.0.0
    validations:
      required: true
  - type: input
    id: create_version
    attributes:
      label: Create Mod version
      description: The version of the base Create mod installed.
      placeholder: e.g. 0.5.1.f / 6.0.0
    validations:
      required: true
  - type: input
    id: easy_villagers_version
    attributes:
      label: Easy Villagers version
      description: The version of the Easy Villagers dependency installed.
      placeholder: e.g. 1.21.1-1.1.23
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: |
        Steps to reproduce the issue.
        Please ensure the bug is consistently reproducible.
      placeholder: |
        1. Place a Villager block / station.
        2. Connect rotational power / stress network.
        3. Insert items or initiate trade automation.
        4. Observe the issue...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: A clear description of what you expected to happen.
    validations:
      required: false
  - type: input
    id: logs
    attributes:
      label: Log / Crash report URL
      description: |
        Please paste the link to your latest.log or crash-report.txt.
        Upload using https://mclo.gs/ or https://gist.github.com/. Do not paste raw logs directly here.
      placeholder: https://mclo.gs/example or https://gist.github.com/example/example
    validations:
      required: false
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / Videos
      description: Drag and drop screenshots or paste video links demonstrating the setup and bug.
    validations:
      required: false
